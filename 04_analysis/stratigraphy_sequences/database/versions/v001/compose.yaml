name: boardman_stratigraphy
services:
  database:
    image: ${BOARDMAN_IMAGE:-postgis/postgis:17-3.5}
    container_name: boardman-stratigraphy-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: boardman
      POSTGRES_USER: boardman_admin
      POSTGRES_PASSWORD: ${BOARDMAN_DB_PASSWORD:?Set the project database password}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardman_admin -d boardman"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  pgdata:
    name: boardman_stratigraphy_pgdata
